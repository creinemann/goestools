################################################################
####                  GOES 18,19 PI                         ####
####   CUSTOM FOR GOES-18 (WEST) + HIMAWARI-9 RECEPTION     ####
####      MODIFICATIONS INCLUDE USRADIOGUY CUSTOM CLUT      ####
####      CHANNELS 08 AND 09 WITH BLACK/RED BORDERS         ####
####      CHANNELS 15 WITH BLACK BACKROUND FOR COMPOSITES   ####
####   2026-11-23: Himawari-9 FC added, duplicate Himawari   ####
####   handler removed (goestools usradioguy-modernize)    ####
################################################################
#  USRadioguy GOES-18 (West) + Himawari-9 goesproc configuration file to process GOES-R series products.
#  NOTE this uses the USradioguy custum LUT https://usradioguy.com/custom-color-lookup-table/

  

# GOES-17 ABI false color.
[[handler]]
type = "image"
origin = "goes17"
regions = [ "fd", "m1", "m2" ]
channels = [ "ch02", "ch13" ]
directory = "./goes17/{region:short|lower}/fc/{time:%Y-%m-%d}"
filename = "GOES17_{region:short}_FC_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  # This reuses the GOES-19 contrast curve assuming it is identical
  [handler.remap.ch02]
  path = "/usr/share/goestools/wxstar/wxstar_goes16_ch02_curve.png"

  # This reuses the GOES-19 LUT assuming it is identical
  [handler.lut]
  path = "/usr/share/goestools/wxstar/wxstar_goes16_lut.png"

  [[handler.map]]
  path = "/usr/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"

  [[handler.map]]
  path = "/usr/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"

# Images relayed from Himawari-8.
